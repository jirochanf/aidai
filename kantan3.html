<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindAR Image Tracking</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .example-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #example-scanning-overlay {
      display: flex;
      align-items: center;
      justify-content: center;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: transparent;
    }

    #example-scanning-overlay.hidden {
      display: none;
    }

    #example-scanning-overlay .inner {
      position: relative;
      width: 80vw;
      max-width: 400px;
      aspect-ratio: 1 / 1;
      border: 2px solid white;
      overflow: hidden;
    }

    #example-scanning-overlay img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0.7;
    }

    #example-scanning-overlay .scanline {
      position: absolute;
      width: 100%;
      height: 2px;
      background: red;
      top: 0;
      animation: scanning 2s linear infinite;
    }

    @keyframes scanning {
      from { top: 0; }
      to { top: 100%; }
    }
  </style>
</head>

<body>

<div class="example-container">

  <!-- スキャン用オーバーレイ -->
  <div id="example-scanning-overlay" class="hidden">
    <div class="inner">
      <img src="./barcero.jpg">
      <div class="scanline"></div>
    </div>
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: https://jirochanf.github.io/card/assets/targets_barcero.mind;
      showStats: false;
      uiScanning: #example-scanning-overlay;
    "
    embedded
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img
        id="myImage"
        src="./26eu00001.JPG"
        crossorigin="anonymous">
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-plane
        src="#myImage"
        position="0 0 0"
        width="1"
        height="0.7">
      </a-plane>
    </a-entity>

  </a-scene>

</div>

</body>
</html>
