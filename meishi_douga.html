<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindAR Image Tracking</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>
  <a-scene
    mindar-image="imageTargetSrc: ./targets_swiss.mind;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- 表示する動画 -->
    <a-assets>
      <video
        id="myVideo"
        src="./movie.mp4"
        preload="auto"
        loop="true"
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>
      <video
        id="myVideo2"
        src="./movie2.mp4"
        preload="auto"
        loop="true"
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>
    </a-assets>

    <!-- カメラ -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- 画像認識したときに動画を表示 -->
    <a-entity mindar-image-target="targetIndex: 0">

      <a-plane
        position="1 0 0"
        rotation="20 0 0"
        width="1"
        height="0.7"
        material="shader: flat; src: #myVideo">
      </a-plane>
      <a-plane
        position="0 0.9 0"
        rotation="20 0 0"
        width="1.2"
        height="0.8"
        material="shader: flat; src: #myVideo2">
      </a-plane>

    </a-entity>

  </a-scene>

  <script>
  const video = document.querySelector("#myVideo");
  const video2 = document.querySelector("#myVideo2");

  const target = document.querySelector(
    "[mindar-image-target]"
  );

  // 画像を認識したとき
  target.addEventListener("targetFound", () => {
    video.play().catch(error => {
      console.log("動画1の再生エラー:", error);
    });

    video2.play().catch(error => {
      console.log("動画2の再生エラー:", error);
    });
  });

  // 画像を見失ったとき
  target.addEventListener("targetLost", () => {
    video.pause();
    video2.pause();
  });
</script>

</body>
</html>
